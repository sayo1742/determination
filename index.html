<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personal Archive</title>
  <meta name="description" content="Personal archive / diary / gallery / character site">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="site-shell">
    <header class="hero" id="siteHero">
      <div class="hero-inner">
        <div class="hero-mark">PERSONAL ARCHIVE</div>
        <div class="hero-sub">diary · gallery · character</div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar leftbar">
        <section class="panel left-profile">
          <div class="profile-avatar"><span>ICON</span></div>
          <h2>PROFILE</h2>
          <p><strong>USERNAME</strong></p>
          <p class="muted">這裡可以放簡短自介、網站說明或角色介紹。</p>
        </section>
        <section class="panel left-note">
          <div class="small-label">SITE NOTE</div>
          <p class="muted">公告、網站備註、更新狀態或其他小工具可以放在這裡。</p>
          <div class="small-label note-gap">LAST UPDATE</div>
          <p><strong id="lastUpdate">—</strong></p>
        </section>
      </aside>

      <main class="main-content" id="app" aria-live="polite"></main>

      <aside class="sidebar rightbar">
        <button class="panel user-card" id="homeUser" type="button" aria-label="回到首頁">
          <div class="mini-icon"><span>USER</span></div>
          <div class="user-copy"><strong>USERNAME</strong><br><span class="muted">X · Plurk · Link</span></div>
        </button>

        <section class="panel gif-box">GIF / LOOP IMAGE</section>

        <nav class="panel menu-panel" aria-label="Main menu">
          <div class="menu-heading">MENU</div>
          <div class="menu-stack">
            <button data-route="home">HOME</button>
            <button data-route="posting">POSTING</button>
            <button data-route="post">POST</button>
            <button data-route="gallery">GALLERY</button>
            <button data-route="character">CHARACTER</button>
            <button data-route="about">ABOUT</button>
          </div>
        </nav>

        <section class="dialogue-panel">
          <div class="dialogue-head"><span>CHAT LOG</span><span class="dialogue-status">● online</span></div>
          <div class="chat-stream" id="chatStream"></div>
        </section>
      </aside>
    </div>

    <footer class="site-footer">© <span id="year"></span> USERNAME · built for GitHub Pages</footer>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="關閉">×</button>
    <img src="" alt="預覽圖片">
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
